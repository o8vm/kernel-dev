name: Temporary official Arm A-profile source transport

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-official-sail-model-sources.yml

permissions:
  contents: read

jobs:
  sail-arm-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire exact official Sail-Arm source
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='1bf2e5574ba9d704639a28401b6a387dcb113cae'
          git init sail-arm
          git -C sail-arm remote add origin https://github.com/rems-project/sail-arm.git
          git -C sail-arm fetch --depth=1 origin "$COMMIT"
          git -C sail-arm checkout --detach FETCH_HEAD
          test "$(git -C sail-arm rev-parse HEAD)" = "$COMMIT"
          printf '%s\n' "$COMMIT" > sail-arm/UPSTREAM_COMMIT
          rm -rf sail-arm/.git
          test -d sail-arm/arm-v9.4-a
          tar --sort=name --mtime='UTC 2026-08-25' --owner=0 --group=0 --numeric-owner \
            -czf sail-arm-${COMMIT}.tar.gz sail-arm
          sha256sum sail-arm-${COMMIT}.tar.gz > sail-arm-${COMMIT}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sail-arm-full-1bf2e557-source
          path: |
            sail-arm-*.tar.gz
            sail-arm-*.tar.gz.sha256
          compression-level: 0
          retention-days: 1
