name: Temporary current lean-sail source transport

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-lean-sail-source.yml

permissions:
  contents: read

jobs:
  transport-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acquire exact lean-sail main source
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='079463134b9c50450b8393e1566a09fc492a34d9'
          git init lean-sail
          git -C lean-sail remote add origin https://github.com/rems-project/lean-sail.git
          git -C lean-sail fetch --depth=1 origin "$COMMIT"
          git -C lean-sail checkout --detach FETCH_HEAD
          test "$(git -C lean-sail rev-parse HEAD)" = "$COMMIT"
          printf '%s\n' "$COMMIT" > lean-sail/UPSTREAM_COMMIT
          rm -rf lean-sail/.git
          tar --sort=name --mtime='UTC 2026-08-25' --owner=0 --group=0 --numeric-owner \
            -czf lean-sail-main-${COMMIT}.tar.gz lean-sail
          sha256sum lean-sail-main-${COMMIT}.tar.gz > lean-sail-main-${COMMIT}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lean-sail-main-07946313-source
          path: |
            lean-sail-main-*.tar.gz
            lean-sail-main-*.tar.gz.sha256
          compression-level: 0
          retention-days: 1
