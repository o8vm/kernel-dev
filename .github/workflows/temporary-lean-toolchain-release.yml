name: Temporary verified Lean toolchain transport

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-lean-toolchain-release.yml

permissions:
  contents: write

env:
  TAG: temporary-lean-v4.33.0-20260824

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download and verify official Lean release
        shell: bash
        run: |
          set -euo pipefail
          URL='https://releases.lean-lang.org/lean4/v4.33.0/lean-4.33.0-linux.tar.zst'
          EXPECTED='4b3fb03c29a1e0a253fb1d11f9bae3725f19a0dc6fc09b3ea16d2c9df3349e2c'
          curl --fail --location --retry 5 --retry-all-errors "$URL" -o lean-4.33.0-linux.tar.zst
          echo "$EXPECTED  lean-4.33.0-linux.tar.zst" | sha256sum -c -
          printf '%s\n' "$URL" > SOURCE_URL.txt

      - name: Measure a runtime-only local toolchain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf unpack minimal
          mkdir unpack minimal
          tar --use-compress-program=unzstd -xf lean-4.33.0-linux.tar.zst -C unpack
          ROOT=$(find unpack -mindepth 1 -maxdepth 1 -type d | head -n1)
          mkdir -p minimal/bin minimal/lib
          cp -a "$ROOT/bin/lean" "$ROOT/bin/lake" minimal/bin/
          if [ -x "$ROOT/bin/leanc" ]; then cp -a "$ROOT/bin/leanc" minimal/bin/; fi
          cp -a "$ROOT/lib/lean" minimal/lib/
          find "$ROOT/lib" -maxdepth 1 -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp -a {} minimal/lib/ \;
          if [ -f "$ROOT/LICENSE" ]; then cp "$ROOT/LICENSE" minimal/; fi
          tar --zstd -cf minimal-lean-v4.33.0.tar.zst minimal
          {
            echo 'Official archive:'
            stat -c 'bytes=%s' lean-4.33.0-linux.tar.zst
            sha256sum lean-4.33.0-linux.tar.zst
            echo
            echo 'Top-level extracted sizes:'
            du -sh "$ROOT"/* | sort -h
            echo
            echo 'Minimal selection:'
            du -sh minimal minimal/bin minimal/lib minimal/lib/lean
            find minimal/bin -maxdepth 1 -type f -printf '%P %s bytes\n' | sort
            find minimal/lib -maxdepth 1 -type f -printf '%P %s bytes\n' | sort
            echo
            echo 'Minimal compressed archive:'
            stat -c 'bytes=%s' minimal-lean-v4.33.0.tar.zst
            sha256sum minimal-lean-v4.33.0.tar.zst
          } > minimal-toolchain-report.txt
          cat minimal-toolchain-report.txt

      - name: Refresh temporary release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Temporary verified Lean v4.33.0 transport' \
            --notes 'Installation transport only. Official Lean release verified before pruning. Delete after local installation.' \
            minimal-lean-v4.33.0.tar.zst minimal-toolchain-report.txt SOURCE_URL.txt

      - name: Commit transport report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .toolchain-transport
          cp minimal-toolchain-report.txt .toolchain-transport/
          git config user.name 'toolchain-transport'
          git config user.email 'actions@users.noreply.github.com'
          git add .toolchain-transport/minimal-toolchain-report.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record minimal Lean toolchain size'
            git push origin HEAD:${{ github.head_ref }}
          fi
