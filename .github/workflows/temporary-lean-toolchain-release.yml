# Installation transport revision 2026-08-24T20:00Z
name: Temporary verified Lean meta overlay transport

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-lean-toolchain-release.yml

permissions:
  contents: read

jobs:
  transport-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and verify official Lean release
        shell: bash
        run: |
          set -euo pipefail
          URL='https://releases.lean-lang.org/lean4/v4.33.0/lean-4.33.0-linux.tar.zst'
          EXPECTED='4b3fb03c29a1e0a253fb1d11f9bae3725f19a0dc6fc09b3ea16d2c9df3349e2c'
          curl --fail --location --retry 5 --retry-all-errors "$URL" -o lean-4.33.0-linux.tar.zst
          echo "$EXPECTED  lean-4.33.0-linux.tar.zst" | sha256sum -c -
          mkdir unpack
          tar --use-compress-program=unzstd -xf lean-4.33.0-linux.tar.zst -C unpack
          ROOT=$(find unpack -mindepth 1 -maxdepth 1 -type d | head -n1)
          echo "LEAN_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify the full official compiler can import Lean and Std
        shell: bash
        run: |
          set -euo pipefail
          cat > MetaSmoke.lean <<'EOF'
          import Lean
          import Std.Tactic.BVDecide
          open Lean
          theorem meta_smoke : (21 + 21 : Nat) = 42 := by decide
          #check meta_smoke
          EOF
          "$LEAN_ROOT/bin/lean" MetaSmoke.lean > meta-smoke.log 2>&1
          "$LEAN_ROOT/bin/lean" --version >> meta-smoke.log
          "$LEAN_ROOT/bin/lean" --githash >> meta-smoke.log
          cat meta-smoke.log

      - name: Build the missing Lean/Std/Lake overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p overlay/bin overlay/lib/lean overlay/include
          cp -a "$LEAN_ROOT/bin/lake" overlay/bin/ 2>/dev/null || true
          cp -a "$LEAN_ROOT/include/lean" overlay/include/ 2>/dev/null || true
          for module in Lean Std Lake; do
            if [ -d "$LEAN_ROOT/lib/lean/$module" ]; then
              cp -a "$LEAN_ROOT/lib/lean/$module" overlay/lib/lean/
            fi
            find "$LEAN_ROOT/lib/lean" -maxdepth 1 \( -type f -o -type l \) \
              -name "$module.olean*" -exec cp -a {} overlay/lib/lean/ \;
            find "$LEAN_ROOT/lib/lean" -maxdepth 1 \( -type f -o -type l \) \
              -name "lib${module}*" -exec cp -a {} overlay/lib/lean/ \;
          done
          cp "$LEAN_ROOT/LICENSE" overlay/ 2>/dev/null || true
          tar --use-compress-program='zstd -15 -T0' -cf lean-v4.33.0-meta-overlay.tar.zst overlay
          {
            echo 'official_archive:'
            stat -c 'bytes=%s' lean-4.33.0-linux.tar.zst
            sha256sum lean-4.33.0-linux.tar.zst
            echo
            echo 'overlay:'
            du -sh overlay overlay/lib/lean/Lean overlay/lib/lean/Std overlay/lib/lean/Lake 2>/dev/null || true
            stat -c 'archive_bytes=%s' lean-v4.33.0-meta-overlay.tar.zst
            sha256sum lean-v4.33.0-meta-overlay.tar.zst
            echo
            echo 'counts:'
            find overlay/lib/lean -name '*.olean' | wc -l
            find overlay/lib/lean -name '*.olean.server' | wc -l
          } > meta-overlay-report.txt
          cat meta-overlay-report.txt

      - name: Fetch pinned lean-sail v4 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v4 https://github.com/rems-project/lean-sail.git lean-sail-v4
          rm -rf lean-sail-v4/.git
          printf '%s\n' 'tag=v4' 'tree=79b4d08505af29d88b3918f32d29840fae1fa191' > lean-sail-v4/PIN.txt
          tar --use-compress-program='zstd -15 -T0' -cf lean-sail-v4-source.tar.zst lean-sail-v4
          sha256sum lean-sail-v4-source.tar.zst > lean-sail-v4-source.sha256

      - name: Upload Lean meta overlay
        uses: actions/upload-artifact@v4
        with:
          name: lean-v4.33.0-meta-overlay
          path: |
            lean-v4.33.0-meta-overlay.tar.zst
            meta-overlay-report.txt
            meta-smoke.log
          compression-level: 0
          retention-days: 1

      - name: Upload lean-sail source
        uses: actions/upload-artifact@v4
        with:
          name: lean-sail-v4-source
          path: |
            lean-sail-v4-source.tar.zst
            lean-sail-v4-source.sha256
          compression-level: 0
          retention-days: 1
